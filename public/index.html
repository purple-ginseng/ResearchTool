<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchTool</title>
<!-- the per-browser look (theme, hints, icon style) before the first paint: prefs.js -->
<script src="js/ui-boot.js"></script>
<!-- the crest (public/brand/, see brand/LICENSE-NOTE.txt) -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Shell only: the header, empty view containers and the Claude aside. Every module in js/ builds its own markup
     inside its container when it loads. Third-party libraries come from /vendor (never a CDN). See ARCHITECTURE.md. -->

<!-- web fonts first: @font-face only (the roles are tokens in base.css, applied in type.css) -->
<link rel="stylesheet" href="css/fonts.css">

<!-- vendor styles (before the app's own, so the app can override them) -->
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="vendor/pdfjs/text-layer.css">

<!-- app styles: base first, then one file per module -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/illustrations.css">
<link rel="stylesheet" href="css/claude.css">
<link rel="stylesheet" href="css/library-list.css">
<link rel="stylesheet" href="css/categories.css">
<link rel="stylesheet" href="css/pdfnav.css">

<!-- type roles last, so they win over the module sheets' font shorthands -->
<link rel="stylesheet" href="css/type.css">
</head>
<body>
<header>
  <!-- the crest and the name; a click opens the Overview (or the Library) - core.js -->
  <a class="brand" id="brand-home" href="#" aria-label="ResearchTool home"><svg class="crest" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><defs><linearGradient id="rt-crest-gold" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f0d27a"/><stop offset="0.5" stop-color="#e2bd55"/><stop offset="1" stop-color="#c9971a"/></linearGradient></defs><path class="rim" d="M3 2.5H29V13.5C29 22 23.2 27 16 30.2C8.8 27 3 22 3 13.5Z" fill="#4a2a80"/><path d="M4.4 3.9H27.6V13.5C27.6 21.1 22.4 25.6 16 28.6C9.6 25.6 4.4 21.1 4.4 13.5Z" fill="#7b4cc2" stroke="url(#rt-crest-gold)" stroke-width="1.4"/><path d="M16 13.6C13.3 12 10.3 11.6 7.4 12.3V21.4C10.3 20.8 13.3 21.3 16 22.9Z" fill="url(#rt-crest-gold)"/><path d="M16 13.6C18.7 12 21.7 11.6 24.6 12.3V21.4C21.7 20.8 18.7 21.3 16 22.9Z" fill="url(#rt-crest-gold)"/><path d="M16.6 12.6C18.4 8.6 21 6.2 24.4 5.1C23.8 8.6 21.4 11.3 17.4 13.1Z" fill="#fbf7ee" stroke="#2e1a52" stroke-width="0.5"/><path d="M15.2 15.8L23.6 5.8" stroke="#2e1a52" stroke-width="0.9" stroke-linecap="round"/></svg><span class="brand-name">ResearchTool</span></a>
  <nav aria-label="Views"><!-- one tab per RT.registerView() --></nav>
  <div class="spacer"></div>
  <!-- the search trigger: palette.js opens the palette (⌘K); core.js adds the icon and the key caps -->
  <button id="btn-palette" class="search-pill" title="Go to anything: find a paper or an action" aria-label="Go to anything: find a paper or an action"><span class="sp-text">Search papers and actions…</span><span class="sp-keys"></span></button>
  <span id="toast" class="toast" role="status" aria-live="polite"></span>
  <!-- kept for tour.js, palette.js and core.js; reached through the Help and More menus -->
  <button id="btn-tour" class="ib" hidden title="Tour: show me around the app, step by step" aria-label="Tour"></button>
  <button id="btn-export" class="ib" hidden title="Export references: write references.bib, notes.md, library.csv and the reading notes to the export folder" aria-label="Export references"></button>
  <button id="btn-help" class="ib" title="Help: the guide, the guided tour and the keyboard shortcuts" aria-label="Help"></button>
  <button id="btn-app-menu" class="ib" title="More: export references, recently deleted papers, backups" aria-label="More"></button>
  <button id="btn-settings" class="ib" title="Preferences" aria-label="Preferences"></button>
  <button id="btn-claude" class="accent ib has-text" title="Show or hide the Claude Code panel" aria-label="Claude Code panel" aria-pressed="false"></button>
</header>
<!-- notices under the header (RT.banner in core.js) -->
<div id="banner-slot" class="banner-slot"></div>

<main>
  <!-- Library tab: list pane (library-list.js, categories.js) + detail pane (reader.js) -->
  <section id="view-library" class="view">
    <div id="library-list" class="list-pane"></div>
    <div id="detail" class="detail-pane"></div>
  </section>

  <!-- Write tab (write.js, projects-home.js, overleaf.js) -->
  <section id="view-write" class="view"></section>

  <!-- Claude panel (claude.js) -->
  <aside id="claude" hidden></aside>
</main>

<!-- vendor scripts -->
